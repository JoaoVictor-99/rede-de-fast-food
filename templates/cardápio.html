<html lang="pt-BR">

  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
 <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand">Navbar</a>
    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
  </div>
</nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <button type="button" class="btn" onclick="window.location.href='index.html'">
    Inicio
 <button type="button" class="btn" onclick="window.location.href='cardápio.html'">
    Cardápio
    <button type="button" class="btn" onclick="window.location.href='lanche.html'">
    lanche
    <button type="button" class="btn" onclick="window.location.href='contatos.html'">
    contato
</button>
</button>
<div class="container mt-4">
  <div class="row">

    <div class="col-md-3">
      <div class="card">
        <img src="{{ url_for ('static', filename'images.png') }}" class="card-img-top" alt="Pizza">
        <div class="card-body">
          <h5 class="card-title">Pizza</h5>
          <p class="card-text">Pizza de queijo e calabresa.</p>
          <p>R$ 55,00</p>
          <button class="btn btn-primary">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <img src="{{ url_for ('static', filename'burguer.png') }}" class="card-img-top" alt="Hambúrguer">
        <div class="card-body">
          <h5 class="card-title">Hambúrguer</h5>
          <p class="card-text">Hambúrguer com queijo,alface e tomate.</p>
          <p>R$ 20,00</p>
          <button class="btn btn-primary">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <img src="{{ url_for ('static', filename'images (1).png') }}" class="card-img-top" alt="Batata Frita">
        <div class="card-body">
          <h5 class="card-title">Batata Frita</h5>
          <p class="card-text">Porção de batatas fritas.</p>
          <p>R$ 15,00</p>
          <button class="btn btn-primary">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card">
        <img src="{{ url_for ('static', filename'images (2).png') }}" class="card-img-top" alt="Pastel">
        <div class="card-body">
          <h5 class="card-title">Pastel</h5>
          <p class="card-text">Pastel recheado com queijo.</p>
          <p>R$ 10,00</p>
          <button class="btn btn-primary">Comprar</button>
        </div>
      </div>
    </div>

  </div>
</div>

</html>
